
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCast AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: white;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    /* Dynamic Weather Card Gradients */
    .card-sunny {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.25) 0%, rgba(59, 130, 246, 0.15) 100%);
      border: 1px solid rgba(251, 191, 36, 0.3);
      box-shadow: 0 10px 30px -10px rgba(251, 191, 36, 0.2);
    }
    .card-night {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.7) 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .card-cloudy {
      background: linear-gradient(135deg, rgba(148, 163, 184, 0.25) 0%, rgba(51, 65, 85, 0.25) 100%);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .card-rainy {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.25) 0%, rgba(30, 58, 138, 0.35) 100%);
      border: 1px solid rgba(59, 130, 246, 0.2);
      box-shadow: 0 10px 30px -10px rgba(30, 58, 138, 0.3);
    }
    .card-snow {
      background: linear-gradient(135deg, rgba(248, 250, 252, 0.2) 0%, rgba(148, 163, 184, 0.25) 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .card-thunder {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25) 0%, rgba(15, 23, 42, 0.5) 100%);
      border: 1px solid rgba(139, 92, 246, 0.3);
      box-shadow: 0 10px 40px -10px rgba(139, 92, 246, 0.2);
    }

    .weather-gradient-sunny {
      background: linear-gradient(to bottom right, #38bdf8, #1e40af);
    }
    .weather-gradient-cloudy {
      background: linear-gradient(to bottom right, #64748b, #1e293b);
    }
    .weather-gradient-rainy {
      background: linear-gradient(to bottom right, #475569, #0f172a);
    }
    
    /* Icon Animations */
    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes sway {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      50% { transform: translateX(4px) rotate(5deg); }
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes rain-drop {
      0% { transform: translateY(-2px); }
      100% { transform: translateY(2px); }
    }
    @keyframes thunder-flicker {
      0%, 90%, 100% { opacity: 1; transform: scale(1); filter: brightness(1); }
      92%, 96% { opacity: 0.8; transform: scale(1.1); filter: brightness(1.5); }
      94%, 98% { opacity: 1; transform: scale(1); filter: brightness(1.2); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes glow-breath {
      0%, 100% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
      50% { box-shadow: 0 0 30px rgba(59, 130, 246, 0.6); }
    }
    @keyframes rain-bar-breath {
      0%, 100% { transform: scaleY(1); opacity: 0.5; }
      50% { transform: scaleY(1.15); opacity: 1; }
    }

    .animate-sun { animation: rotate-slow 25s linear infinite; display: inline-block; }
    .animate-cloud { animation: float 5s ease-in-out infinite; display: inline-block; }
    .animate-rain { animation: rain-drop 0.6s ease-in-out infinite alternate; display: inline-block; }
    .animate-snow { animation: sway 4s ease-in-out infinite; display: inline-block; }
    .animate-thunder { animation: thunder-flicker 6s ease-in-out infinite; display: inline-block; }
    .animate-fog { animation: pulse-soft 6s ease-in-out infinite; display: inline-block; }
    .animate-bar-pulse { 
      animation: rain-bar-breath 3s ease-in-out infinite; 
      transform-origin: bottom;
    }

    .shimmer-overlay {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      background-size: 200% 100%;
      animation: shimmer 3s infinite;
    }
    .glow-active {
      animation: glow-breath 3s ease-in-out infinite;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
